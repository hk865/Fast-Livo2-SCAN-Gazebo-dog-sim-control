name: Building backend checks
on:
  push:
    branches: ["feature/fastlivo2-backend-building-20261030"]
  pull_request:
    paths: ["src/localization/backend/**", "tests/**", "src/planning/**", ".github/workflows/backend-checks.yml"]
jobs:
  cpu-business-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy libeigen3-dev cmake g++
      - name: Build native SE3 graph
        run: |
          cmake -S src/localization/backend/native -B build/backend_graph -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install/backend"
          cmake --build build/backend_graph --parallel 2
          cmake --install build/backend_graph
      - name: Backend and 3D route business checks
        env:
          PYTHONPATH: src:tests
          PYTHONDONTWRITEBYTECODE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python3 -B -m unittest discover -s tests -p 'test_backend*.py' -v
          python3 -B -m unittest test_route_progress test_terrain_speed test_planned_step_filter -v
